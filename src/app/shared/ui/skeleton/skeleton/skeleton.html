@switch (variant) {
  @case ('cart') {
    <div
      class="flex w-full flex-col gap-2 rounded-lg bg-primary-100 p-4 md:flex-row md:items-center md:gap-4"
      aria-hidden="true"
    >
      @for (bar of [1, 2, 3, 4, 5, 6]; track bar) {
        <div class="h-4 w-full animate-pulse rounded bg-primary-200 md:w-auto md:flex-1"></div>
      }
    </div>
  }
  @default {
    <div class="flex h-full flex-col gap-3 rounded-lg bg-primary-100/80 p-4" aria-hidden="true">
      <div class="h-6 w-2/3 animate-pulse rounded bg-primary-200"></div>
      <div class="h-4 w-1/3 animate-pulse rounded bg-primary-200"></div>
      <div class="h-48 w-full animate-pulse rounded bg-primary-200"></div>
      <div class="h-4 w-1/2 animate-pulse rounded bg-primary-200"></div>
    </div>
  }
}
